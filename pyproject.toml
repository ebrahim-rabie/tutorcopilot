[project]
name = "tutorcopilot"
version = "0.1.0"
description = "Eval-driven RAG support agent - Phase 1 of the TutorCopilot AI engineer project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openai>=1.40",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-multipart>=0.0.9",
    "edge-tts>=6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
# Phase 3 P3.3: the (large) training stack. Pins keep the SFTConfig kwargs
# used by scripts/finetune_lora.py valid; torch already ships with the base
# deps via sentence-transformers. Not needed for --check-only or make gate.
train = [
    "trl>=0.10,<0.12",
    "transformers>=4.45,<4.48",
    "peft>=0.13,<0.15",
    "datasets>=3.0,<3.2",
    "accelerate>=1.0,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "PL", "DTZ"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "BLE001", # tools/agent catch broad exceptions intentionally
    "RUF012", # tool schemas are immutable by convention
    "DTZ005", # naive utcnow is fine for this project
    "ASYNC221",
    "E501",   # long lines are acceptable in descriptions/string literals
    "PLC0415", # lazy imports keep torch/sentence-transformers optional
    "PLR0912", # agent loop e2e branch complexity is a design choice
    "PLR0913", # many-arg service functions are intentional here
    "PLR0915",
    "PLR0917",
    "PLR0911",
    "PLR2004", # magic numbers in comparisons are clear in context
    "PLW0603", # tracer global singleton
    "PLW1510", # subprocess check=False is deliberate (we check returncode)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008", "BLE001"]
"scripts/*" = ["E501"]